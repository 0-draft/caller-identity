name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The signer is checked against the signature examples AWS publishes.
      # If this fails, every signature the site renders is wrong.
      - run: npm test
      - run: npm run build
